[package]
name = "noise"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license = "MPL-2.0"
description = "Implements a subset of Noise protocol used by the CTAP caBLE/Hybrid transport."

[features]
test = []

[dependencies]
libc = "0.2"
nserror = { path = "../../../../xpcom/rust/nserror" }
nsstring = { path = "../../../../xpcom/rust/nsstring" }
pkcs11-bindings = ">= 0.1.3"
sha2 = "0.10.2"
thin-vec = { version = "0.2.1", features = ["gecko-ffi"] }
xpcom = { path = "../../../../xpcom/rust/xpcom" }

[dependencies.nss-rs]
git = "https://github.com/mozilla/nss-rs"
version = "0.13"
default-features = false
