[package]
name = "noise"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license = "MPL-2.0"
description = "Implements a subset of Noise protocol used by the CTAP caBLE/Hybrid transport."

[features]
default = ["system-time"]

# Use SystemTime::now. This feature must be disabled on platforms that don't support it.
system-time = []

xpcom = [
    "dep:nserror",
    "dep:nsstring",
    "dep:thin-vec",
    "dep:xpcom",
]

[dependencies]
libc = "0.2"
nserror = { path = "../../../../xpcom/rust/nserror", optional = true }
nsstring = { path = "../../../../xpcom/rust/nsstring", optional = true }
pkcs11-bindings = ">= 0.1.3"
serde_cbor_2 = "0.13"
sha2 = "0.10.2"
thin-vec = { version = "0.2.1", features = ["gecko-ffi"], optional = true }
thiserror = "2"
xpcom = { path = "../../../../xpcom/rust/xpcom", optional = true }

[dependencies.nss-rs]
git = "https://github.com/mozilla/nss-rs"
version = "0.14"
default-features = false
features = ["gecko"]

[build-dependencies]
mozbuild = { path = "../../../../build/rust/mozbuild" }
